<text x="32.0" y="140.0" font-size="52" fill="#0b0b0b" font-weight="700" text-anchor="start">26 of 45</text>
<text x="250.0" y="116.0" font-size="17" fill="#0b0b0b" font-weight="600" text-anchor="start">items answered by the typical card</text>
<text x="250.0" y="140.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">Median of 14 cards. The fewest was 18, the most 37 (Llama).</text>
