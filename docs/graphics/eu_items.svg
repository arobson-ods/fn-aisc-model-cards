<svg xmlns="http://www.w3.org/2000/svg" width="960" height="608" viewBox="0 0 960 608" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Public model cards answer just over half of the EU form</title><desc id="d">The typical card answers 26 of 45 items. By section: Distribution and licences 99%; Model properties 86%; Intended use 71%; Training process 71%; General information 64%; Training data 40%; Compute used in training 10%; Energy use 2%. The form sends training-process, compute and energy items only to regulators.</desc>
