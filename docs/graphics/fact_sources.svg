<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Most of what model cards disclose is prose, not data</title><desc id="d">The lab&#x27;s own card metadata 17%; Generated by Hugging Face 22%; The repository&#x27;s config.json 5%; Written in the README text 56%. Machine-readable in total: 44%.</desc>
<rect width="960" height="442" fill="#fcfcfb"/>
<text x="32.0" y="48.0" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="start">Most of what model cards disclose is prose, not data</text>
<text x="32.0" y="76.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start">Where the 477 facts disclosed by 14 model cards come from</text>
<path d="M32.0,150.0 h150.2 a0,0 0 0 1 0,0 v32.0 a0,0 0 0 1 -0,0 h-150.2 z" fill="#2a78d6"><title>The lab&#x27;s own card metadata: 17%</title></path>
<text x="107.1" y="171.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">17%</text>
<path d="M184.2,150.0 h191.5 a0,0 0 0 1 0,0 v32.0 a0,0 0 0 1 -0,0 h-191.5 z" fill="#eb6834"><title>Generated by Hugging Face: 22%</title></path>
<text x="279.9" y="171.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">22%</text>
<path d="M377.6,150.0 h46.8 a0,0 0 0 1 0,0 v32.0 a0,0 0 0 1 -0,0 h-46.8 z" fill="#1baf7a"><title>The repository&#x27;s config.json: 5%</title></path>
<text x="401.0" y="171.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">5%</text>
<path d="M426.5,150.0 h497.5 a4,4 0 0 1 4,4 v24.0 a4,4 0 0 1 -4,4 h-497.5 z" fill="#c3c2b7"><title>Written in the README text: 56%</title></path>
<text x="677.2" y="171.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">56%</text>
<path d="M32,142 v-8 h392.5 v8" fill="none" stroke="#52514e" stroke-width="1.5"/>
<text x="32.0" y="126.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Machine-readable: 44%</text>
<path d="M426.5,142 v-8 h501.5 v8" fill="none" stroke="#52514e" stroke-width="1.5"/>
<text x="928.0" y="126.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="end">Prose only: 56%</text>
<rect x="32" y="214" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="58.0" y="226.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">17%</text>
<text x="102.0" y="226.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">The lab&#x27;s own card metadata</text>
<text x="362.0" y="226.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">e.g. licence, base model, languages, task</text>
<rect x="32" y="248" width="14" height="14" rx="3" fill="#eb6834"/>
<text x="58.0" y="260.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">22%</text>
<text x="102.0" y="260.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Generated by Hugging Face</text>
<text x="362.0" y="260.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">e.g. parameter count, commit, access terms, derivation type</text>
<rect x="32" y="282" width="14" height="14" rx="3" fill="#1baf7a"/>
<text x="58.0" y="294.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">5%</text>
<text x="102.0" y="294.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">The repository&#x27;s config.json</text>
<text x="362.0" y="294.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">e.g. context length, precision</text>
<rect x="32" y="316" width="14" height="14" rx="3" fill="#c3c2b7"/>
<text x="58.0" y="328.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">56%</text>
<text x="102.0" y="328.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Written in the README text</text>
<text x="362.0" y="328.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">e.g. training method, limitations, intended use</text>
<text x="32.0" y="380.0" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Less than a fifth comes from metadata the lab itself declared. Generated values can be wrong:</text>
<text x="32.0" y="400.0" font-size="14" fill="#0b0b0b" font-weight="400" text-anchor="start">Hugging Face tags one fine-tune as an adapter, though it ships full merged weights.</text>
<text x="32.0" y="424.0" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Source: 14 open-weight model cards on Hugging Face, retrieved September 2026. Shares are of all facts disclosed, pooled across the 14 cards.</text>
</svg>
