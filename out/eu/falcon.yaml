  answers:
  - fact_id: integration_means
    status: prose
    value: Can be used via Hugging Face `transformers`, `vLLM` or `SGLang`; vLLM and SGLang servers are
      started with a reasoning parser and queried via an OpenAI-compatible client; the model generates
      think content wrapped in a `<think>...</think>` block followed by the final response; recommended
      temperature 0.6, top-p 0.95, max new tokens up to 65536.
    quote: 'Currently to use this model, you can either rely on Hugging Face `transformers`, `vLLM` or
      `SGLang` library. [...] Model will generate think content wrapped in a `<think>...</think>` block,
      followed by the final response. [...] We recommend using a **temperature** of **0.6** and **top-p**
      as **0.95** with max new tokens up to 65536. [...] For vLLM, simply start a server by executing
      the command below: [...] For SGLang, simply start a server by executing the command below:'
    source_url: https://huggingface.co/tiiuae/Falcon-H1R-7B/raw/a6f74bf181389908efd6970878d7ee2b42f5d417/README.md
    source_type: card
