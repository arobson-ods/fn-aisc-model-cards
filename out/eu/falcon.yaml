- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: Built on Falcon-H1-7B-Base; trained via cold-start supervised fine-tuning with long reasoning
      traces, then further enhanced by scaling RL with GRPO.
    quote: Built on top of [Falcon-H1-7B-Base](https://huggingface.co/tiiuae/Falcon-H1-7B-Base), it was
      trained via cold-start supervised fine-tuning with long reasoning traces and further enhanced by
      scaling RL with GRPO.
    source_url: https://huggingface.co/tiiuae/Falcon-H1R-7B/raw/a6f74bf181389908efd6970878d7ee2b42f5d417/README.md
    source_type: card
