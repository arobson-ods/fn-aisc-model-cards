  - fact_id: additional_assets
    status: prose
    value: 'Code, checkpoints and training details are released: Open-Instruct (DPO and RLVR), OLMo-Core
      (pre-training and SFT) and OLMo-Eval (evaluation) on GitHub; checkpoints accessible via Hugging
      Face revisions (e.g. step_XXXX naming; only the final few checkpoints for this model); training
      datasets (Dolci-Instruct-SFT, Dolci-Instruct-DPO, Dolci-Instruct-RL) on Hugging Face; logs coming
      soon.'
    quote: '- Open-Instruct for DPO and RLVR: https://github.com/allenai/open-instruct [...] - OLMo-Core
      for pre-training and SFT: https://github.com/allenai/OLMo-core [...] - OLMo-Eval for evaluation:
      https://github.com/allenai/OLMo-Eval [...] We are releasing all code, checkpoints, logs (coming
      soon), and associated training details. [...] We have released checkpoints for these models. For
      post-training, the naming convention is `step_XXXX`. [...] To load a specific model revision with
      HuggingFace, simply add the argument `revision`: [...] - Datasets: [Dolci-Think-SFT-7B](https://huggingface.co/datasets/allenai/dolci-thinking-sft),
      [Dolci-Instruct-SFT](https://huggingface.co/datasets/allenai/dolci-instruct-sft)'
