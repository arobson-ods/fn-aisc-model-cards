- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: 'Pre-trained on the Dolma 3 dataset, then post-trained in three stages on Dolci datasets: Stage
      1 SFT (supervised fine-tuning), Stage 2 DPO (direct preference optimization), Stage 3 RLVR (reinforcement
      learning from verifiable rewards).'
    quote: 'These models are pre-trained on the Dolma 3 dataset and post-trained on the Dolci datasets.
      [...] #### Stage 1: SFT [...] #### Stage 2:DPO [...] - direct preference optimization on the Dolci-Think-DPO-7B
      dataset. This dataset consits of math, code, chat, and general knowledge queries. [...] #### Stage
      3: RLVR [...] - reinforcement learning from verifiable rewards on the Dolci-Think-RL-7B dataset.
      This dataset consits of math, code, instruction-following, and general chat queries.'
    source_url: https://huggingface.co/allenai/Olmo-3.1-32B-Instruct/raw/ac0587e4a7744a551c059d8cd17ba220bc940dae/README.md
    source_type: card
