    value: Use with the HuggingFace transformers library (transformers 4.57.0 or higher) via AutoModelForCausalLM/AutoTokenizer;
      optional 8-bit quantization with bitsandbytes; specific checkpoints loadable via the revision argument;
      fine-tuning with the OLMo-core repository.
    quote: 'Olmo 3 is supported in transformers 4.57.0 or higher: [...] You can use OLMo with the standard
      HuggingFace transformers library: [...] olmo = AutoModelForCausalLM.from_pretrained("allenai/Olmo-3.1-32B-Instruct")
      [...] load_in_8bit=True)  # Requires bitsandbytes [...] To load a specific model revision with HuggingFace,
      simply add the argument `revision`: [...] 1. Fine-tune with the OLMo-core repository:'
    source_url: https://huggingface.co/allenai/Olmo-3.1-32B-Instruct/raw/ac0587e4a7744a551c059d8cd17ba220bc940dae/README.md
