- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Deployable via vLLM (recommended), llama.cpp, LM Studio, Ollama, SGLang and transformers; usable
      in Mistral Vibe via the Mistral API or a local vLLM server; fine-tuning via Axolotl and Unsloth.
      vLLM serving uses an OpenAI-compatible client with reasoning_effort set to 'none' or 'high'.
    quote: '- [`vllm (recommended)`](https://github.com/vllm-project/vllm): See [here](#vllm-recommended).
      [...] - [`llama.cpp`](https://github.com/ggml-org/llama.cpp): See [here](https://huggingface.co/unsloth/Mistral-Medium-3.5-128B-GGUF)
      for Unsloth''s GGUFs. [...] - [`SGLang`](https://github.com/sgl-project/sglang): See [here](#sglang).
      [...] - [`transformers`](https://github.com/huggingface/transformers): See [here](#transformers).
      [...] Mistral Medium 3.5 can be selected by starting `vibe`. If it is the first time you launch
      `vibe`, it will: [...] - [`Axolotl`](https://github.com/axolotl-ai-cloud/axolotl): See [here](https://docs.axolotl.ai/docs/models/mistral-medium-3_5.html).
      [...] REASONING_EFFORT = "none" # Toggle reasoning with ''high''.'
    source_url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/raw/22b2b868a15677cfa6061277ed2f653d1349a9ab/README.md
    source_type: card
