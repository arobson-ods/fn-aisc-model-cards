  - fact_id: target_systems
    status: prose
    value: Can be used in chat assistants (Le Chat), coding agents (Vibe), and agentic systems with native
      function calling/tool use and JSON output; also supports system prompts and multimodal (text and
      image) input.
    quote: 'Mistral Medium 3.5 replaces its predecessor Mistral Medium 3.1 and Magistral in Le Chat. It
      also replaces Devstral 2 in our

      coding agent Vibe. [...] **Agentic**: Best-in-class agentic capabilities with native function calling
      and JSON output. [...] **System Prompt**: Strong adherence and support for system prompts.'
    source_url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/raw/22b2b868a15677cfa6061277ed2f653d1349a9ab/README.md
