  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: Dense 128B parameter model with a 256k context window; multimodal input (text and image) with
      text output; vision encoder trained from scratch to handle variable image sizes and aspect ratios;
      instruct and reasoning in a single set of weights, with reasoning effort configurable per request.
    quote: 'It is a dense 128B model with a 256k context window, handling instruction-following, reasoning,

      and coding in a single set of weights. [...] We trained the vision encoder from

      scratch to handle variable image sizes and aspect ratios. [...] **Multimodal input**: Accepts both
      text and image input, with text output. [...] **Instruct and Reasoning functionalities** with function
      calls (reasoning effort configurable per request).'
    source_url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/raw/22b2b868a15677cfa6061277ed2f653d1349a9ab/README.md
    source_type: card
