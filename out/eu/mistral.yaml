- id: intended_uses
  section: Use
  item: Intended uses
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: intended_uses
    status: prose
    value: Instruction-following, reasoning, and coding tasks (including agentic coding and function calling)
      in a single unified model, with text and image input.
    quote: 'It is a dense 128B model with a 256k context window, handling instruction-following, reasoning,

      and coding in a single set of weights. [...] Reasoning effort is configurable per request, so the
      same model can answer a quick chat reply or work through a complex agentic run. [...] Use `reasoning_effort="high"`
      for complex tasks and agentic coding.'
    source_url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/raw/22b2b868a15677cfa6061277ed2f653d1349a9ab/README.md
    source_type: card
