- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Used via Hugging Face transformers (AutoProcessor and AutoModelForImageTextToText with trust_remote_code=True),
      with transformers==4.57.1 and molmo_utils; inputs built with processor.apply_chat_template using
      chat messages containing text, video or image content; supports video QA, video pointing, tracking,
      multi-image QA and multi-image pointing.
    quote: "pip install transformers==4.57.1 [...] pip install torch pillow einops torchvision accelerate\
      \ decord2 molmo_utils [...] from transformers import AutoProcessor, AutoModelForImageTextToText\
      \ [...] inputs = processor.apply_chat_template(\n    messages,\n    tokenize=True,\n    add_generation_prompt=True,\n\
      \    return_tensors=\"pt\",\n    return_dict=True,\n) [...] ### Tracking Video QA (best with max_fps=8)"
    source_url: https://huggingface.co/allenai/Molmo2-8B/raw/e28fa28597e5ec5e0cca2201dd8ab33d48bc4a1b/README.md
    source_type: card
