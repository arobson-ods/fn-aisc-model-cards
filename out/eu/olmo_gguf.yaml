  - fact_id: additional_assets
    status: prose
    value: 'Code, checkpoints and training details are released (logs coming soon). Repositories: Open-Instruct
      (DPO and RLVR) at https://github.com/allenai/open-instruct; OLMo-Core (pre-training and SFT) at
      https://github.com/allenai/OLMo-core; OLMo-Eval (evaluation) at https://github.com/allenai/OLMo-Eval.
      Checkpoints are accessible via the HuggingFace `revision` argument (naming `step_XXXX`). Datasets
      include Dolci-Instruct-SFT-7B, Dolci-Instruct-DPO-7B and Dolci-Instruct-RL-7B on Hugging Face.'
    quote: 'We are releasing all code, checkpoints, logs (coming soon), and associated training details.
      [...] - Open-Instruct for DPO and RLVR: https://github.com/allenai/open-instruct [...] - OLMo-Core
      for pre-training and SFT: https://github.com/allenai/OLMo-core [...] - OLMo-Eval for evaluation:
      https://github.com/allenai/OLMo-Eval [...] We have released checkpoints for these models. For post-training,
      the naming convention is `step_XXXX`. [...] To load a specific model revision with HuggingFace,
      simply add the argument `revision`: [...] - Datasets: [Dolci-Think-RL-7B](https://huggingface.co/datasets/allenai/Dolci-Think-RL-7B),
      [Dolci-Instruct-RL-7B](https://huggingface.co/datasets/allenai/Dolci-Instruct-RL-7B)'
    source_url: https://huggingface.co/unsloth/Olmo-3-7B-Instruct-GGUF/raw/a2a9ae53f5a95087616b3f45ca96e9d2631344ee/README.md
