  - fact_id: integration_means
    status: prose
    value: Use with the HuggingFace transformers library (version 4.57.0 or higher) via AutoModelForCausalLM
      and AutoTokenizer; optional 8-bit quantization with bitsandbytes; ChatML-style chat template with
      <|im_start|>/<|im_end|> tags and a default system message.
    quote: 'Olmo 3 is supported in transformers 4.57.0 or higher: [...] You can use OLMo with the standard
      HuggingFace transformers library: [...] olmo = AutoModelForCausalLM.from_pretrained("allenai/Olmo-3-7B-Instruct")
      [...] load_in_8bit=True)  # Requires bitsandbytes [...] The chat template for this model is formatted
      as:'
    source_url: https://huggingface.co/unsloth/Olmo-3-7B-Instruct-GGUF/raw/a2a9ae53f5a95087616b3f45ca96e9d2631344ee/README.md
