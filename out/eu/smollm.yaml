  - fact_id: distribution_channels
    status: prose
    value: Open weights on Hugging Face (model, checkpoints, quantized checkpoints collection); can be
      deployed via vLLM and SGLang in an OpenAI-compatible API; local inference with llama.cpp, ONNX,
      MLX, MLC and ExecuTorch.
    quote: '**Fully open model**: open weights + full training details including public data mixture and
      training configs [...] For local inference, you can use `llama.cpp`, `ONNX`, `MLX`, `MLC` and `ExecuTorch`.
      You can find quantized checkpoints in this collection (https://huggingface.co/collections/HuggingFaceTB/smollm3-686d33c1fdffe8e635317e23)
      [...] You can use vLLM and SGLang to deploy the model in an API compatible with OpenAI format.'
