- id: scope_and_main_characteristics
  section: Information on the data used for training, testing, and validation
  item: Scope and main characteristics
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: data_scope
    status: prose
    value: Pretrained on 11.2T tokens with a staged curriculum of web, code, math and reasoning data;
      midtraining on 140B reasoning tokens. Trained on English, French, Spanish, German, Italian and Portuguese
      as main languages, plus fewer tokens of Arabic (standard), Chinese and Russian data.
    quote: 'The model is a decoder-only transformer using GQA and NoPE (with 3:1 ratio), it was pretrained
      on 11.2T tokens with a staged curriculum of web, code, math and reasoning data. Post-training included
      midtraining on 140B reasoning tokens followed by supervised fine-tuning and alignment via Anchored
      Preference Optimization (APO). [...] The model has also been trained on Arabic (standard), Chinese
