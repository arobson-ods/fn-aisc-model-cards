- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Load with transformers (v4.53.0+) via AutoModelForCausalLM/AutoTokenizer and tokenizer.apply_chat_template;
      /think and /no_think system prompt flags or enable_thinking kwarg; tool calling via xml_tools or
      python_tools; serve with vLLM and SGLang in an OpenAI-compatible API; local inference with llama.cpp,
      ONNX, MLX, MLC and ExecuTorch.
    quote: 'The modeling code for SmolLM3 is available in transformers `v4.53.0`, so make sure to upgrade
      your transformers version. [...] For choosing between enabling, you can provide the `/think` and
      `/no_think` flags through the system prompt [...] We also provide the option of specifying the whether
      to use extended thinking through the `enable_thinking` kwarg [...] Under the argument `xml_tools`
      for standard tool-calling: these tools will be called as JSON blobs within XML tags [...] Or under
      `python_tools`: then the model will call tools like python functions in a `<code>` snippet [...]
      For local inference, you can use `llama.cpp`, `ONNX`, `MLX`, `MLC` and `ExecuTorch`. [...] You can
      use vLLM and SGLang to deploy the model in an API compatible with OpenAI format.'
    source_url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B/raw/a07cc9a04f16550a088caea529712d1d335b0ac1/README.md
    source_type: card
