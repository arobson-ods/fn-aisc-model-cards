  answers:
  - fact_id: intended_uses
    status: prose
    value: General-purpose multimodal AI systems and applications requiring vision-language understanding
      with selective reasoning, particularly in memory- or compute-constrained environments; primary domains
      are scientific and mathematical reasoning over visual inputs and computer-use agent (CUA) tasks;
      also general multimodal tasks such as image captioning, visual question answering, optical character
      recognition, object localization, and grounding.
    quote: Phi-4-Reasoning-Vision-15B is designed for general-purpose multimodal AI systems and applications
      that require vision-language understanding with selective reasoning capabilities, particularly in
      memory- or compute-constrained environments. [...] **Computer-use agent (CUA) tasks:** such as interpreting
      screen content, localizing interactive GUI elements, and selecting actions within graphical user
      interfaces. [...] The model is also capable of general multimodal tasks including image captioning,
      visual question answering, optical character recognition, object localization, and grounding.
