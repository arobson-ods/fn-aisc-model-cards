    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Use the chat template with the system prompt for inference; force thinking by appending `<think>`
      or non-thinking by appending `<nothink>` to the generation template. Requires torch >= 2.7.1, transformers
      >= 4.57.1, and vllm >= 0.15.2 (only if using vLLM). Recommended to host on a vLLM server using bf16
      precision.
    quote: 'Given the nature of the training data, always use chat template and system prompt for inference.
      [...] To force a thinking response, append the `<think>` token to the generation template: [...]
      To force a non-thinking response, append the `<nothink>` token to the generation template: [...]
      - `torch >= 2.7.1` [...] - `transformers >= 4.57.1` [...] - `vllm >= 0.15.2` (only required if using
      vLLM) [...] It is recommended that users host Phi-4-Reasoning-Vision-15B on a vLLM server using
      bf16 precision.'
    source_url: https://huggingface.co/microsoft/Phi-4-reasoning-vision-15B/raw/c3e4fac79ddace21976ced56fbf1564b8bd8c89f/README.md
    source_type: card
