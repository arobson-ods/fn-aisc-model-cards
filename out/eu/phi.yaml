- id: design_specifications_of_the_model
  section: Model properties
  item: Design specifications of the model
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: Mid-fusion architecture built on the Phi-4-Reasoning language model backbone and SigLIP-2 vision
      encoder; the vision encoder converts images into visual tokens, which are projected into the language
      model's embedding space and injected into the pretrained language model, leveraging both pretrained
      components while keeping training and inference costs manageable. Dynamic resolution vision encoder
      with up to 3,600 visual tokens for high-resolution understanding (GUI grounding, fine-grained document
      analysis). Bidirectional attention is applied within images (intra-image) to improve spatial reasoning
      without the overfitting risks of broader bidirectional schemes. 15B parameters.
    quote: 'Phi-4-Reasoning-Vision-15B is a compact open-weight multimodal reasoning model built on the
      Phi-4-Reasoning language model backbone and the SigLIP-2 vision encoder, using a mid-fusion architecture.
      [...] In this architecture, the vision encoder first converts images into visual tokens, which are
      then projected into the language model''s embedding space and injected into the pretrained language
      model. This approach leverages the strengths of both pretrained components while keeping training
      and inference costs manageable. [...] The model employs a dynamic resolution vision encoder with
      up to 3,600 visual tokens, enabling high-resolution image understanding critical for tasks such
      as GUI grounding and fine-grained document analysis. [...] Bidirectional attention is applied within
      images (intra-image) to improve spatial reasoning without the overfitting risks observed with broader
      bidirectional schemes. [...] **Parameters:** 15B  '
    source_url: https://huggingface.co/microsoft/Phi-4-reasoning-vision-15B/raw/c3e4fac79ddace21976ced56fbf1564b8bd8c89f/README.md
    source_type: card
