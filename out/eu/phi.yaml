- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: Supervised Fine-Tuning (SFT) on a curated mixture of reasoning and non-reasoning data, built
      on the Phi-4-Reasoning backbone with the SigLIP-2 vision encoder (mid-fusion); safety alignment
      also via SFT.
    quote: Phi-4-Reasoning-Vision-15B is trained with Supervised Fine-Tuning (SFT) on a carefully curated
      mixture of reasoning and non-reasoning data. [...] Phi-4-Reasoning-Vision-15B is a compact open-weight
      multimodal reasoning model built on the Phi-4-Reasoning language model backbone and the SigLIP-2
      vision encoder, using a mid-fusion architecture. [...] The safety alignment is achieved through
      Supervised Fine-Tuning (SFT) using data that includes both helpfulness and harmlessness examples,
      as well as targeted questions and answers across multiple safety categories.
    source_url: https://huggingface.co/microsoft/Phi-4-reasoning-vision-15B/raw/c3e4fac79ddace21976ced56fbf1564b8bd8c89f/README.md
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: Mid-fusion architecture combining the Phi-4-Reasoning backbone and SigLIP-2 vision encoder,
      chosen to leverage both pretrained components while keeping training and inference costs manageable.
      A dynamic resolution vision encoder (up to 3,600 visual tokens) enables high-resolution understanding
      for GUI grounding and document analysis. Bidirectional attention is applied only within images to
      improve spatial reasoning without the overfitting risks of broader bidirectional schemes. A single
      model handles both reasoning and non-reasoning modes rather than separate models.
    quote: This approach leverages the strengths of both pretrained components while keeping training
      and inference costs manageable. [...] The model employs a dynamic resolution vision encoder with
      up to 3,600 visual tokens, enabling high-resolution image understanding critical for tasks such
      as GUI grounding and fine-grained document analysis. [...] Bidirectional attention is applied within
      images (intra-image) to improve spatial reasoning without the overfitting risks observed with broader
      bidirectional schemes. [...] Rather than training separate models for each mode, the model operates
      as a single system that can invoke extended chain-of-thought reasoning (using `<think>...</think>`
      blocks) for tasks like mathematical and scientific reasoning, or default to direct inference (tagged
      with `<nothink>`) for perception-focused tasks such as captioning, object detection, and grounding.
    source_url: https://huggingface.co/microsoft/Phi-4-reasoning-vision-15B/raw/c3e4fac79ddace21976ced56fbf1564b8bd8c89f/README.md
    source_type: card
