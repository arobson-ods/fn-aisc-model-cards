- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: 'Post-trained from Granite-4.1-8B-Base (pre-trained on a large-scale English and multilingual
      corpus) in stages: supervised fine-tuning (SFT) on instruction-following, chain-of-thought and reasoning
      data, then multi-phase, multi-environment reinforcement learning using GRPO, followed by a preference-alignment
      (RLHF) phase.'
    quote: Granite-4.2-8B is post-trained from [Granite-4.1-8B-Base](https://huggingface.co/ibm-granite/granite-4.1-8b-base)
      through a rigorous multi-stage pipeline that progressively unlocks reasoning, tool use, and instruction-following
      capabilities. [...] Granite-4.2-8B builds on [Granite-4.1-8B-Base](https://huggingface.co/ibm-granite/granite-4.1-8b-base),
      which was pre-trained on a large-scale English as well as multilingual corpus. [...] The SFT stage
      draws on instruction-following, chain-of-thought, and reasoning data to cultivate the model's reasoning
      and thinking abilities. [...] The final stage of training applies multi-phase, multi-environment
      reinforcement learning using Group Relative Policy Optimization (GRPO). [...] After the reward-driven
      phases, a preference-alignment (RLHF) phase tunes helpfulness, conversational quality, and safety.
    source_url: https://huggingface.co/ibm-granite/granite-4.2-8b/raw/f8de16cdcdbc6c779ca517604e050d82cc119e44/README.md
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: 'The card gives some rationale for training choices: SFT uses instruction-following, chain-of-thought
      and reasoning data to cultivate reasoning and thinking abilities; hyperparameters were tuned before
      scaling to all three model sizes; for the 30B model a second SFT phase up-sampled agentic data while
      retaining a smaller share of general replay data. RL uses GRPO across multiple environments, with
      verifiable rewards where available and a generative reward model for open-ended prompts; an RLHF
      phase tunes helpfulness, conversational quality, and safety.'
    quote: The SFT stage draws on instruction-following, chain-of-thought, and reasoning data to cultivate
      the model's reasoning and thinking abilities. [...] Hyperparameters were tuned before training was
      scaled to all three model sizes. [...] For the 30B model, we conducted a second SFT phase, in which
      the agentic data was up-sampled while a smaller share of general replay data was retained. [...]
      Most environments provide verifiable rewards, while open-ended prompts are scored by a generative
      reward model. [...] After the reward-driven phases, a preference-alignment (RLHF) phase tunes helpfulness,
      conversational quality, and safety.
    source_url: https://huggingface.co/ibm-granite/granite-4.2-8b/raw/f8de16cdcdbc6c779ca517604e050d82cc119e44/README.md
    source_type: card
