  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: Decoder-only dense transformer (GraniteForCausalLM) with 8B parameters; Grouped Query Attention
      with 32 attention heads and 8 KV heads; RoPE (θ = 10,000,000); SwiGLU MLP (hidden size 12800); RMSNorm
      (ε = 1e-5); untied input/output embeddings; 40 layers; embedding size 4096. Dense model (no experts).
      No rationale for the design choices is stated.
    quote: 'Granite-4.2-8B is built on a decoder-only dense transformer architecture with the following
      core components: [...] * **Attention:** Grouped Query Attention (GQA) with 32 attention heads and
      8 KV heads [...] * **Position Embedding:** Rotary Position Embedding (RoPE) with θ = 10,000,000
      [...] * **Feed-Forward:** MLP with SwiGLU activation (hidden size 12800) [...] * **Normalization:**
      RMSNorm (ε = 1e-5) [...] * **Embeddings:** Separate input/output embeddings (not tied) [...] | **Architecture**
      | GraniteForCausalLM |'
    source_url: https://huggingface.co/ibm-granite/granite-4.2-8b/raw/f8de16cdcdbc6c779ca517604e050d82cc119e44/README.md
    source_type: card
