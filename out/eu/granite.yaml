  status: answered
  answers:
  - fact_id: data_provenance
    status: prose
    value: 'SFT corpus comprises four sources: publicly available datasets under permissive licenses,
      internally generated synthetic data (reasoning, tool calling, chain-of-thought), agentic traces
      collected across diverse tasks, and a curated selection of human-authored data. Base model pre-trained
      on a large-scale English and multilingual corpus (no provenance breakdown given).'
    quote: 'the training corpus comprises four sources: (1) publicly available datasets under permissive
      licenses, (2) internally generated synthetic data targeting reasoning, tool calling, and chain-of-thought
      capabilities, (3) agentic traces collected across a diverse range of tasks, and (4) a curated selection
      of human-authored data. [...] which was pre-trained on a large-scale English as well as multilingual
      corpus.'
    source_url: https://huggingface.co/ibm-granite/granite-4.2-8b/raw/f8de16cdcdbc6c779ca517604e050d82cc119e44/README.md
