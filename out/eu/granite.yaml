- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Can be served with vLLM (custom granite_thinking_parser reasoning parser, qwen3_coder tool-call
      parser) and SGLang (v0.5.18+), via OpenAI-compatible API; also usable with Hugging Face Transformers
      via tokenizer.apply_chat_template with enable_thinking, low_effort and tools options; ChatML-style
      prompt format with <think>...</think> reasoning.
    quote: Granite-4.2-8B is optimized for deployment with [vLLM](https://github.com/vllm-project/vllm).
      [...] Granite-4.2-8B can also be served with [SGLang](https://github.com/sgl-project/sglang) (v0.5.18+)
      for high-throughput inference. [...] > **Tool calling parser:** Use `qwen3_coder`. [...] text =
      tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True, enable_thinking=True)
      [...] - **Thinking enabled** — The generation prompt ends with `<|im_start|>assistant\n<think>\n`,
      causing the model to reason until it emits `</think>`, then produce the final answer.
    source_url: https://huggingface.co/ibm-granite/granite-4.2-8b/raw/f8de16cdcdbc6c779ca517604e050d82cc119e44/README.md
    source_type: card
