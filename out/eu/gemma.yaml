  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: The card gives rationales for some design choices. Hybrid attention (local sliding window interleaved
      with global) gives the speed and low memory footprint of a lightweight model without losing deep
      awareness for long-context tasks. Training data includes code to learn programming syntax and patterns,
      and mathematical text to learn logical reasoning, symbolic representation and to address mathematical
      queries.
    quote: This hybrid design delivers the processing speed and low memory footprint of a lightweight
      model without sacrificing the deep awareness required for complex, long-context tasks. [...] Exposing
      the model to code helps it to learn the syntax and patterns of programming languages, which improves
      its ability to generate code and understand code-related questions. [...] Training on mathematical
      text helps the model learn logical reasoning, symbolic representation, and to address mathematical
      queries.
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
