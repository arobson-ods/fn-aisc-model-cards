      code, mathematics, images, and audio, with a cutoff date of January 2025. Web content covers over
      140 languages.'
    quote: 'Our pre-training dataset is a large-scale, diverse collection of data encompassing a wide
      range of domains and modalities, which includes web documents, code, images, audio, with a cutoff
      date of January 2025. [...] **Web Documents**: A diverse collection of web text ensures the model
      is exposed to a broad range of linguistic styles, topics, and vocabulary. The training dataset includes
      content in over 140 languages. [...] **Mathematics**: Training on mathematical text helps the model
      learn logical reasoning, symbolic representation, and to address mathematical queries.'
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
