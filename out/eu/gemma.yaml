  answers:
  - fact_id: data_acquisition
    status: prose
    value: 'Pre-training data is a large-scale, diverse collection spanning web documents, code, mathematics
      and images (audio also listed), with a January 2025 cutoff; web text covers over 140 languages.
      Filtering applied: CSAM filtering, automated sensitive/personal data filtering, and content quality
      and safety filtering. The card does not describe annotation, synthetic data generation, or how rights
      were obtained.'
    quote: 'Our pre-training dataset is a large-scale, diverse collection of data encompassing a wide
      range of domains and modalities, which includes web documents, code, images, audio, with a cutoff
      date of January 2025. [...] **Web Documents**: A diverse collection of web text ensures the model
      is exposed to a broad range of linguistic styles, topics, and vocabulary. The training dataset includes
      content in over 140 languages. [...] **CSAM Filtering**: Rigorous CSAM (Child Sexual Abuse Material)
      filtering was applied at multiple stages in the data preparation process to ensure the exclusion
      of harmful and illegal content. [...] **Additional methods**: Filtering based on content quality
      and safety in line with [our policies](https://ai.google/static/documents/ai-responsibility-update-published-february-2025.pdf).'
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
