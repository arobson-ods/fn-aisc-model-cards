- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Usable with the Hugging Face Transformers library (pip install -U transformers torch accelerate;
      load via AutoProcessor and AutoModelForMultimodalLM). Chat format uses system, assistant and user
      roles; thinking is enabled with the <|think|> token at the start of the system prompt.
    quote: 'You can use all Gemma 4 models with the latest version of Transformers. To get started, install
      the necessary dependencies in your environment: [...] `pip install -U transformers torch accelerate`
      [...] from transformers import AutoProcessor, AutoModelForMultimodalLM [...] Compared to Gemma 3,
      the models use standard `system`, `assistant`, and `user` roles. To properly manage the thinking
      process, use the following control tokens: [...] **Trigger Thinking:** Thinking is enabled by including
      the `<|think|>` token at the start of the system prompt.'
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
