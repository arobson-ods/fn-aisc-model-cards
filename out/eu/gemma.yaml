- id: model_architecture
  section: Model properties
  item: Model architecture
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: architecture_family
    status: prose
    value: Dense architecture (31B Dense) with hybrid attention interleaving local sliding window attention
      and full global attention; the Gemma 4 family includes Dense and Mixture-of-Experts variants
    quote: Featuring both Dense and Mixture-of-Experts (MoE) architectures, Gemma 4 is well-suited for
      tasks like text generation, coding, and reasoning. [...] The models employ a hybrid attention mechanism
      that interleaves local sliding window attention with full global attention, ensuring the final layer
      is always global. [...] | Property | E2B | E4B | 12B Unified | 31B Dense |
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
- id: design_specifications_of_the_model
  section: Model properties
  item: Design specifications of the model
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: '31B Dense model: 30.7B parameters, 60 layers, 1024-token sliding window, 256K context, 262K
      vocabulary. Hybrid attention interleaves local sliding window attention with full global attention
      (final layer always global), giving the speed and low memory footprint of a lightweight model without
      sacrificing deep awareness for complex, long-context tasks. Global layers use unified Keys and Values
      and Proportional RoPE (p-RoPE) to optimize memory for long contexts.'
    quote: The models employ a hybrid attention mechanism that interleaves local sliding window attention
      with full global attention, ensuring the final layer is always global. [...] This hybrid design
      delivers the processing speed and low memory footprint of a lightweight model without sacrificing
      the deep awareness required for complex, long-context tasks. [...] To optimize memory for long contexts,
      global layers feature unified Keys and Values, and apply Proportional RoPE (p-RoPE).  [...] | **Total
      Parameters** | 2.3B effective <br> (5.1B with embeddings) | 4.5B effective <br> (8B with embeddings)
      | 11.95B | 30.7B | [...] | **Layers** | 35 | 42 | 48 | 60 | [...] | **Sliding Window** | 512 tokens
      | 512 tokens | 1024 tokens | 1024 tokens |
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
