- id: measures_to_detect_identifiable_biases
  section: Information on the data used for training, testing, and validation
  item: Measures to detect identifiable biases
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: data_bias_measures
    status: prose
    value: The card acknowledges that VLMs trained on real-world data can reflect socio-cultural biases;
      mitigation consists of careful scrutiny, input data pre-processing, and post-training evaluations.
      Training data was filtered for CSAM, certain personal/sensitive data, and by content quality and
      safety. It also notes biases or gaps in training data can limit responses, and encourages continuous
      monitoring and exploration of de-biasing techniques.
    quote: 'VLMs trained on large-scale, real-world text and image data can reflect socio-cultural biases
      embedded in the training material. Gemma 4 models underwent careful scrutiny, input data pre-processing,
      and post-training evaluations as reported in this card to help mitigate the risk of these biases.
      [...] **Perpetuation of biases**: It''s encouraged to perform continuous monitoring (using evaluation
      metrics, human review) and the exploration of de-biasing techniques during model training, fine-tuning,
      and other use cases. [...] Filtering based on content quality and safety in line with [our policies](https://ai.google/static/documents/ai-responsibility-update-published-february-2025.pdf).
      [...] The quality and diversity of the training data significantly influence the model''s capabilities.
      Biases or gaps in the training data can lead to limitations in the model''s responses.'
    source_url: https://huggingface.co/google/gemma-4-31B-it/raw/842da3794eaa0b77d5f08bae87a17459d91ff475/README.md
    source_type: card
