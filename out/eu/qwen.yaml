    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: intended_uses
    status: prose
    value: Designed for coding, professional work, research, and long-horizon agentic tasks, carrying
      complex multi-step tasks through to completion; text-only generation with thinking mode.
    quote: Built on the architectural foundation of Qwen3.5, Qwen3.8 delivers substantial gains across
      coding, professional work, research, and long-horizon agentic tasks. Beyond answering harder questions,
      Qwen3.8 is designed to carry complex, multi-step tasks through to completion with greater reliability.
      [...] Qwen3.8-2.4T-A95B is a text-only model that requires thinking mode for all interactions.
    source_url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/207bd685a7e3696cfaff12ded7c6a7ea0f88c996/README.md
    source_type: card
- id: type_and_nature_of_ai_systems_in_which_the_general
  section: Use
  item: Type and nature of AI systems in which the general-purpose AI model can be integrated
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: target_systems
    status: prose
    value: 'Agentic systems and coding/development tools: designed for long-horizon, multi-step agentic
      tasks, with support for popular harnesses and development tools for integration into existing stacks'
    quote: 'Beyond answering harder questions, Qwen3.8 is designed to carry complex, multi-step tasks
      through to completion with greater reliability. [...] **Downstream Compatibility**: Broader support
      for popular harnesses and development tools, making it easier to integrate into your existing stack.
      [...] **Agent Execution**: Stronger autonomous planning and better handling of environment feedback,
      leading to more reliable end-to-end task completion.'
    source_url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/207bd685a7e3696cfaff12ded7c6a7ea0f88c996/README.md
    source_type: card
- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Hugging Face Transformers format weights compatible with vLLM, SGLang, TokenSpeed; deployable
      via SGLang, vLLM and TokenSpeed; usable through the Chat Completions API (OpenAI Python SDK) including
      Qwen Cloud; thinking mode required, with reasoning_effort (xhigh default, medium, low) and preserve_thinking
      options.
    quote: 'This repository contains model weights and configuration files for the post-trained model
      in the Hugging Face Transformers format. [...] These artifacts are compatible with vLLM, SGLang,
      TokenSpeed, etc. [...] Qwen3.8 can be deployed with popular inference frameworks, e.g.: [...] The
      Chat Completions API can be used with most inference frameworks, as well as [Qwen Cloud](https://www.qwencloud.com).
      [...] Qwen3.8 comes with official support for `reasoning_effort`, which can be used to adjust reasoning
      depth and control cost: [...] Every response will automatically begin with reasoning enclosed in
      `<think>\n...</think>\n\n` before the final output.'
    source_url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/207bd685a7e3696cfaff12ded7c6a7ea0f88c996/README.md
    source_type: card
