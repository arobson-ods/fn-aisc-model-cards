- id: model_architecture
  section: Model properties
  item: Model architecture
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: architecture_family
    status: prose
    value: Causal Language Model with a hybrid Mixture-of-Experts architecture (Gated DeltaNet and Gated
      Attention layers, each followed by MoE); 2.4T total / 95B activated parameters
    quote: 'Type: Causal Language Model [...] Number of Parameters: 2.4T in total and 95B activated [...]
      Hidden Layout: 23 × (3 × (Gated DeltaNet → MoE) → 1 × (Gated Attention → MoE)) [...] Number of Experts:
      512'
    source_url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/207bd685a7e3696cfaff12ded7c6a7ea0f88c996/README.md
    source_type: card
- id: design_specifications_of_the_model
  section: Model properties
  item: Design specifications of the model
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: Causal language model with 2.4T total and 95B activated parameters; 92 layers; hidden layout
      23 × (3 × (Gated DeltaNet → MoE) → 1 × (Gated Attention → MoE)); Mixture of Experts with 512 experts,
      10 routed + 1 shared activated; hidden dimension 8192. Built on the architectural foundation of
      Qwen3.5. The card gives no detailed rationale for the design choices.
    quote: '- Type: Causal Language Model [...] Number of Parameters: 2.4T in total and 95B activated
      [...] Number of Layers: 92 [...] Hidden Layout: 23 × (3 × (Gated DeltaNet → MoE) → 1 × (Gated Attention
      → MoE)) [...] Number of Experts: 512 [...] Number of Activated Experts: 10 Routed + 1 Shared [...]
      Hidden Dimension: 8192 [...] Built on the architectural foundation of Qwen3.5, Qwen3.8 delivers
      substantial gains across coding, professional work, research, and long-horizon agentic tasks.'
    source_url: https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B/raw/207bd685a7e3696cfaff12ded7c6a7ea0f88c996/README.md
    source_type: card
