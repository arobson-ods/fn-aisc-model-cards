  answers:
  - fact_id: additional_assets
    status: prose
    value: 'Released alongside the model: a technical report PDF; an `encoding` folder with a Python reference
      implementation (encoding.py) and test cases for prompt encoding; the deepseek-recipe Rust libraries
      with Python bindings (GitHub); an `inference` folder with instructions for weight conversion and
      running inference locally; an `evaluation` folder with instructions for reproducing DeepSWE v1.1
      results (dsh-minimal and mini-swe-agent), including a patch for integrating dsh-minimal with Pier.'
    quote: <a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf"><b>Technical
      Report</b> 👁️</a> [...] The [`encoding`](encoding/README.md) folder contains a self-contained Python
      reference implementation (`encoding.py`) with test cases for multi-turn conversations, tool calling,
      thinking mode, numeric reasoning effort, mid-conversation system messages, and interleaved image
      content. [...] For production use, we additionally release [deepseek-recipe](https://github.com/deepseek-ai/deepseek-recipe),
      a set of Rust libraries with Python bindings that provides the same prompt format as a maintained,
      protocol-aware toolkit. [...] Please refer to the [`inference`](inference/README.md) folder for
      instructions on weight conversion and running inference locally. [...] The [`evaluation`](evaluation/README.md)
      folder contains step-by-step instructions for reproducing the DeepSWE v1.1 benchmark results, covering
      both the `dsh-minimal` agent and the official `mini-swe-agent`. The patch required to integrate
      `dsh-minimal` with [Pier](https://github.com/datacurve-ai/pier) is also included there.
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
