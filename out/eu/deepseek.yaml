- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: Pre-trained from scratch on a multimodal corpus of 45T tokens (sparse attention at 64K sequence
      length, context extended to 1M at 34T tokens); post-training follows SFT → RL → on-policy distillation
      (OPD), with changes in the data pipeline (large-scale automated synthesis of agent tasks and environments).
    quote: '**Pre-training.** DeepSeek-V4.1-Flash is trained from scratch on a multimodal corpus comprising
      **45T tokens**, with sparse attention trained at a sequence length of 64K and context extended to
      1M tokens at 34T tokens. [...] **Post-training.** The post-training recipe follows the standard
      SFT → RL → on-policy distillation (OPD) paradigm without algorithmic modifications. All substantive
      changes lie instead in the data pipeline: large-scale automated synthesis of agent tasks and environments
      with progressive scaling of data, tasks, and rollouts.'
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
  - fact_id: hyperparameters
    status: prose
    value: 'Only sequence length is stated: sparse attention trained at a sequence length of 64K, with
      context extended to 1M tokens at 34T tokens (45T-token corpus). Learning rate, batch size, optimiser
      and epochs are not given.'
    quote: DeepSeek-V4.1-Flash is trained from scratch on a multimodal corpus comprising **45T tokens**,
      with sparse attention trained at a sequence length of 64K and context extended to 1M tokens at 34T
      tokens.
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: Post-training follows the standard SFT → RL → on-policy distillation (OPD) paradigm without
      algorithmic modifications, with all substantive changes in the data pipeline (large-scale automated
      synthesis of agent tasks and environments, progressive scaling of data, tasks, and rollouts). Architecturally,
      the Causal Encoder-Decoder projects the decoder's global KV cache from final encoder hidden states,
      activating only 8B parameters per token during prefill and 16B during decode to improve cost efficiency
      for input-heavy agentic workloads.
    quote: '**Post-training.** The post-training recipe follows the standard SFT → RL → on-policy distillation
      (OPD) paradigm without algorithmic modifications. All substantive changes lie instead in the data
      pipeline: large-scale automated synthesis of agent tasks and environments with progressive scaling
      of data, tasks, and rollouts. [...] This allows the model to activate only **8B parameters per token
      during prefill** and **16B during decode**, substantially improving cost efficiency for input-heavy
      agentic workloads.'
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
