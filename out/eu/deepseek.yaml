  - fact_id: integration_means
    status: prose
    value: 'No Jinja chat template; a Python reference prompt-encoding implementation (encoding.py in
      the encoding folder) is provided, plus deepseek-recipe (Rust libraries with Python bindings) for
      production prompt encoding/parsing of Messages, Chat Completions and Responses API requests. Local
      inference instructions (weight conversion and running) are in the inference folder. Recommended
      sampling: temperature 1.0, top_p 0.95 or 1.0.'
