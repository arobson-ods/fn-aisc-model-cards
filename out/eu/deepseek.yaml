      folder contains a self-contained Python reference implementation (`encoding.py`) with test cases
      for multi-turn conversations, tool calling, thinking mode, numeric reasoning effort, mid-conversation
      system messages, and interleaved image content. [...] For production use, we additionally release
      [deepseek-recipe](https://github.com/deepseek-ai/deepseek-recipe), a set of Rust libraries with
      Python bindings that provides the same prompt format as a maintained, protocol-aware toolkit. [...]
