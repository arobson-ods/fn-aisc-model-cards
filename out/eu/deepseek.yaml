- id: model_architecture
  section: Model properties
  item: Model architecture
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: architecture_family
    status: prose
    value: 'Multimodal Mixture-of-Experts (MoE) with a Causal Encoder-Decoder (CED) architecture: a 40-layer
      Transformer (20-layer causal encoder followed by a 20-layer decoder)'
    quote: 'We introduce **DeepSeek-V4.1-Flash**, a multimodal Mixture-of-Experts (MoE) model with 552B
      backbone parameters and support for contexts of up to one million tokens. [...] DeepSeek-V4.1-Flash
      adopts a **Causal Encoder-Decoder (CED)** architecture: a 40-layer Transformer organized as a 20-layer
      causal encoder followed by a 20-layer decoder.'
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
- id: design_specifications_of_the_model
  section: Model properties
  item: Design specifications of the model
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: architecture_details
    status: prose
    value: 'Multimodal MoE with 552B backbone parameters, up to one million tokens context. Causal Encoder-Decoder:
      40-layer Transformer (20-layer causal encoder, 20-layer decoder); decoder''s global KV cache projected
      from final encoder hidden states, so only 8B parameters active per token in prefill and 16B in decode,
      improving cost efficiency for input-heavy agentic workloads. 1 shared expert and 384 routed experts
      per MoE layer, 6 routed experts active per token. Uses CSA2 (Full, Reindex, Reuse modes) with FP4
      main KV caching, reducing global KV cache to 890 bytes per token (roughly 1/4 of DeepSeek-V4-Flash).'
    quote: 'We introduce **DeepSeek-V4.1-Flash**, a multimodal Mixture-of-Experts (MoE) model with 552B
      backbone parameters and support for contexts of up to one million tokens. [...] DeepSeek-V4.1-Flash
      adopts a **Causal Encoder-Decoder (CED)** architecture: a 40-layer Transformer organized as a 20-layer
      causal encoder followed by a 20-layer decoder. [...] With CED, the decoder''s global KV cache is
      projected from the final encoder hidden states rather than derived from each decoder layer''s own
      hidden states. This allows the model to activate only **8B parameters per token during prefill**
      and **16B during decode**, substantially improving cost efficiency for input-heavy agentic workloads.
      [...] The model uses 1 shared expert and 384 routed experts per MoE layer, activating 6 routed experts
      per token. [...] Combined with **FP4 main KV caching** (E2M1 format, one E4M3 scale per 16 channels),
      these designs reduce the global KV cache footprint to **890 bytes per token** — roughly **1/4**
      of DeepSeek-V4-Flash.'
    source_url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/raw/dba1be0a40aa45a94ad051997016db3960a90277/README.md
    source_type: card
