- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: 'Four post-training stages on top of SmolLM3-3B: LoRA supervised fine-tuning on a synthetic
      formal-logic corpus, checkpoint fusion (parameter-space averaging of intermediate SFT checkpoints),
      WiSE-FT interpolation toward the base with λ = 0.25, and MGPO (entropy-weighted GRPO reinforcement
      learning against a programmatic verifier), published checkpoint step 2071.'
    quote: 'Four stages on top of the base model: [...] 1. **LoRA supervised fine-tuning** on a synthetic
      formal-logic corpus covering the Track A [...] 2. **Checkpoint fusion** — parameter-space averaging
      of intermediate SFT checkpoints selected [...] 3. **WiSE-FT interpolation** toward the pretrained
      base, `W = (1 − λ)·W_base + λ·W_finetuned` [...] 4. **MGPO** — entropy-weighted GRPO reinforcement
      learning against a programmatic verifier, with [...] partial credit for loose matches and token-F1
      so that all-fail prompt groups still produce'
    source_url: https://huggingface.co/webAI-Official/TwIL-LM3/raw/e4f94da572d9857a91ca0dca857cebb0cbe6755a/README.md
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: WiSE-FT interpolation toward the base with λ = 0.25 (only a quarter of the fine-tuned delta
      retained), chosen by constrained optimisation (maximise in-domain score subject to minimal held-out
      degradation) so held-out capability survives. Checkpoint fusion averaged intermediate SFT checkpoints
      selected by a diversity probe rather than the final checkpoint. MGPO (entropy-weighted GRPO) used
      partial credit for loose matches and token-F1 so all-fail prompt groups still produce gradient.
      A sibling arm without the conservative interpolation scored higher in-domain but lost about twelve
      points of held-out capability; this release is the balanced point of that trade.
    quote: "parameter-space averaging of intermediate SFT checkpoints selected\n   by a diversity probe,\
      \ rather than taking the final checkpoint. [...] with **λ = 0.25** — i.e. only a quarter of the\
      \ fine-tuned delta is retained. λ was chosen by\n   constrained optimisation: maximise in-domain\
      \ score subject to minimal degradation on held-out\n   benchmarks. This conservative λ is the direct\
      \ reason held-out capability survives. [...] with\n   partial credit for loose matches and token-F1\
      \ so that all-fail prompt groups still produce\n   gradient. [...] A sibling arm that skipped stage\
      \ 3's conservative interpolation scores considerably higher\nin-domain (macro gate 0.515) but gives\
      \ back roughly twelve points of held-out capability. This\nrelease is the balanced point of that\
      \ trade; the other was not published."
    source_url: https://huggingface.co/webAI-Official/TwIL-LM3/raw/e4f94da572d9857a91ca0dca857cebb0cbe6755a/README.md
    source_type: card
