- id: type_and_nature_of_ai_systems_in_which_the_general
  section: Use
  item: Type and nature of AI systems in which the general-purpose AI model can be integrated
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: out_of_scope_uses
    status: prose
    value: Not a general assistant or chat model; it is tuned for formal logic only. It has no safety
      tuning beyond the base model's and no instruction-following alignment (IFEval regressed slightly).
      No claim is made about code generation or tool use.
    quote: 'It is not a general assistant: there is no safety or preference tuning here beyond what SmolLM3

      carries, and instruction following regressed slightly. [...] **Not a chat model.** It was optimised
      against automatic verifiers on logic tasks. It has had no

      safety tuning beyond whatever the base model carries, and no instruction-following alignment

      work — IFEval regressed slightly. [...] **Scope.** Tuned for formal logic. The Track B suite does
      not cover code generation or tool use

      (HumanEval, LiveCodeBench and BFCL were not run for this model or its base), so this release

      makes no claim about those.'
    source_url: https://huggingface.co/webAI-Official/TwIL-LM3/raw/e4f94da572d9857a91ca0dca857cebb0cbe6755a/README.md
    source_type: card
- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Hugging Face transformers (AutoModelForCausalLM/AutoTokenizer with apply_chat_template, bf16);
      GGUF builds for llama.cpp (llama-cli); evaluated via vLLM backend; model emits a <think>…</think>
      block before the answer; greedy decoding (do_sample=False) with ≥2048 new tokens recommended
    quote: "model = AutoModelForCausalLM.from_pretrained(\n    model_id, torch_dtype=torch.bfloat16, device_map=\"\
      auto\"\n) [...] inputs = tok.apply_chat_template( [...] Quantized GGUF builds ship in this repository\
      \ alongside the safetensors weights. The `smollm3`\narchitecture is supported by llama.cpp, and\
      \ the chat template, `<|im_end|>` EOS and BOS are\ncarried into the GGUF metadata, so chat mode\
      \ works without extra flags. [...] llama-cli -m TwIL-LM3-Q4_K_M.gguf -cnv --temp 0 -n 2048 [...]\
      \ The model opens a `<think>...</think>` reasoning block\nbefore answering, so a short generation\
      \ budget truncates reasoning and scores far worse. [...] The published Track A and Track B numbers\
      \ were measured on the **bf16** weights through vLLM"
    source_url: https://huggingface.co/webAI-Official/TwIL-LM3/raw/e4f94da572d9857a91ca0dca857cebb0cbe6755a/README.md
    source_type: card
