- id: data_curation_methodologies
  section: Information on the data used for training, testing, and validation
  item: Data curation methodologies
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: data_curation
    status: prose
    value: Reasoning SFT data was built by having InternVL3-78B describe images and feeding the descriptions
      to DeepSeek-R1 to sample rollouts; rollouts with an incorrect final answer were filtered out. Random
      JPEG compression is included in pre-training as augmentation, and NTP loss is re-weighted by square
      averaging.
    quote: To construct such data, we first use InternVL3-78B to describe the image and then input the
      description into DeepSeek-R1 to sample rollouts with detailed reasoning processes. Rollouts with
      an incorrect final answer are filtered out. [...] The random JPEG compression is also included to
      enhance the model's real-world performance.
    source_url: https://huggingface.co/OpenGVLab/InternVL3_5-GPT-OSS-20B-A4B-Preview-HF/raw/49b11e8d5e9d4c822de52dee190f95c988009559/README.md
