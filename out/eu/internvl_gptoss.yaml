- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: 'Training pipeline: Multimodal Continual Pre-Training (CPT), Supervised Fine-Tuning (SFT),
      and Cascade Reinforcement Learning (CascadeRL). CascadeRL first uses Mixed Preference Optimization
      (MPO) under offline RL, followed by GSPO under online RL. The Flash version additionally uses Visual
      Consistency Learning (ViCO).'
    quote: 'Our training pipeline comprises four stages: Multimodal Continual Pre-Training (**CPT**),
      Supervised Fine-Tuning (**SFT**), and Cascade Reinforcement Learning (**CascadeRL**). In CascadeRL,
      we first fine-tune the model using Mixed Preference Optimization (**MPO**) under an offline RL setting,
      followed by **GSPO** under an oneline RL setting. [...] For the Flash version of InternVL3.5, we
      additionally introduce a lightweight training stage, termed Visual Consistency Learning (**ViCO**),
      which reduces the token cost required to represent an image patch.'
    source_url: https://huggingface.co/OpenGVLab/InternVL3_5-GPT-OSS-20B-A4B-Preview-HF/raw/49b11e8d5e9d4c822de52dee190f95c988009559/README.md
    source_type: card
  - fact_id: hyperparameters
    status: prose
    value: 'Only partial: during the SFT stage the context window is set to 32K tokens. The card does
      not state learning rate, batch size, optimiser or epochs.'
    quote: In this stage, the context window is set to 32K tokens to adapt long-context information.
    source_url: https://huggingface.co/OpenGVLab/InternVL3_5-GPT-OSS-20B-A4B-Preview-HF/raw/49b11e8d5e9d4c822de52dee190f95c988009559/README.md
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: Cascade RL combines offline RL (MPO) as an efficient warm-up for stable convergence and high-quality
      rollouts, then online RL (GSPO) to refine the output distribution from the model's own rollouts,
      achieving significant gains at a fraction of the GPU time cost. GSPO was chosen because it is more
      effective for training both dense and MoE models. Square averaging re-weights the NTP loss to mitigate
      bias toward longer or shorter responses.
    quote: 'Cascade RL aims to combine the benefits of offline RL and online RL to progressively facilitate
      the post-training of MLLMs in an efficient manner. [...] Specifically, we first fine-tune the model
      using an offline RL algorithm as an efficient warm-up stage to reach a satisfied results, which
      can guarantee the high-quality rollouts for the latter stage. [...] Subsequently, we employ an online
      RL algorithm to further refine the output distribution based on rollouts generated by the model
      itself.  Compared to the single offline or online RL stage, our cascaded RL achieves significant
      performance improvements at a fraction of the GPU time cost. [...] During the online RL stage, we
      employ GSPO, without reference model constraints, as our online RL algorithm, which we find more
      effective in training both dense and mixture-of-experts (MoE) models. [...] Additionally, to mitigate
      bias toward either longer or shorter responses during training, we adopt the square averaging to
      re-weight the NTP loss  as follows:'
    source_url: https://huggingface.co/OpenGVLab/InternVL3_5-GPT-OSS-20B-A4B-Preview-HF/raw/49b11e8d5e9d4c822de52dee190f95c988009559/README.md
    source_type: card
