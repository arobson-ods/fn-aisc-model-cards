  - fact_id: architecture_details
    status: prose
    value: 'Follows the "ViT–MLP–LLM" paradigm; language model initialized from the Qwen3 series and GPT-OSS,
      vision encoder from InternViT-300M and InternViT-6B; retains the Dynamic High Resolution strategy
      from InternVL1.5. This 20B-A4B model: 0.3B vision params, 20.9B language params, 21.2B total with
      4B active (A4B).'
