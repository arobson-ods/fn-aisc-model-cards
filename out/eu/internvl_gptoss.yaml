  - fact_id: integration_means
    status: prose
    value: Usable via Hugging Face transformers (AutoModelForImageTextToText; transformers>=4.55.0 required
      for the 20B version), and deployable with LMDeploy (pipeline, OpenAI-compatible api_server) or vLLM
      (recommended for InternVL3.5-20B-A4B since lmdeploy does not yet support GPT-OSS). Thinking mode
      is enabled via a system prompt (R1_SYSTEM_PROMPT) with do_sample=True and temperature=0.6.
    quote: '> In most cases, both [LMDeploy](https://github.com/InternLM/lmdeploy) and [vLLM](https://github.com/vllm-project/vllm)
      can be used for model deployment. However, for InternVL3.5-20B-A4B, we recommend using vLLM since
      lmdeploy has not yet supported GPT-OSS. [...] > Please use transformers>=4.52.1 to ensure the model
      works normally. For the 20B version of our model, transformers>=4.55.0 is required. [...] from transformers
      import AutoTokenizer, AutoModelForImageTextToText [...] To enable thinking mode, please set the
      system prompt to our Thinking System Prompt. When enabling Thinking mode, we recommend setting `do_sample=True`
      and `temperature=0.6` to mitigate undesired repetition. [...] LMDeploy''s `api_server` enables models
      to be easily packed into services with a single command. The provided RESTful APIs are compatible
      with OpenAI''s interfaces. Below are an example of service startup:'
