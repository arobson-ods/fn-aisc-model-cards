- id: design_specifications_of_the_training_process
  section: Training process
  item: Design specifications of the training process
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: training_method
    status: prose
    value: Pretraining on ~40 trillion tokens of multimodal data (Llama 4 Scout), followed by safety fine-tuning
      using human-generated and synthetic data; the card does not detail other post-training stages (e.g.,
      SFT, DPO, RL).
    quote: Llama 4 Scout was pretrained on ~40 trillion tokens and Llama 4 Maverick was pretrained on
      ~22 trillion tokens of multimodal data from a mix of publicly available, licensed data and information
      from Meta’s products and services. [...] We employ a multi-faceted approach to data collection,
      combining human-generated data from our vendors with synthetic data to mitigate potential safety
      risks.
    source_url: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct
    source_type: card
- id: decision_rationale
  section: Training process
  item: Decision rationale
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: design_rationale
    status: prose
    value: Safety fine-tuning was done to give developers a readily available, safe, and powerful model
      and reduce their deployment workload. The card says it put great emphasis on driving down refusals
      to benign prompts, and targeted removing preachy, overly moralizing language and fixing formatting
      issues.
    quote: The primary objective of conducting safety fine-tuning is to offer developers a readily available,
      safe, and powerful model for various applications, reducing the workload needed to deploy safe AI
      systems. [...] Building on the work we started with our Llama 3 models, we put a great emphasis
      on driving down model refusals to benign prompts for Llama 4. [...] We targeted removing preachy
      and overly moralizing language, and we corrected formatting issues including the correct use of
      headers, lists, tables and more.
    source_url: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct
    source_type: card
