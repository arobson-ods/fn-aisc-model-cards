- id: technical_means_for_model_integration
  section: Use
  item: Technical means for model integration
  audience:
    AIO: false
    NCA: false
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: integration_means
    status: prose
    value: Use with Hugging Face transformers (v4.51.0 or later) via AutoProcessor and Llama4ForConditionalGeneration,
      with processor.apply_chat_template for chat-format messages (text and image inputs) and model.generate;
      the card also points to the Llama cookbook for generation parameters and recipes.
    quote: Please, make sure you have transformers v4.51.0 installed, or upgrade using pip install -U
      transformers. [...] from transformers import AutoProcessor, Llama4ForConditionalGeneration [...]
      inputs = processor.apply_chat_template( [...] outputs = model.generate( [...] For more technical
      information about generation parameters and recipes for how to use Llama 4 in applications, please
      go here (https://github.com/meta-llama/llama-cookbook).
    source_url: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct
    source_type: card
