  answers:
  - fact_id: additional_assets
    status: prose
    value: Quantized checkpoints are provided (Scout as BF16 weights, on-the-fly int4 quantization code
      provided); technical info and recipes for using Llama 4 in applications are in the llama-cookbook
      repo (https://github.com/meta-llama/llama-cookbook); system-level protections (Llama Guard, Prompt
      Guard, Code Shield) are available, with reference implementation at https://github.com/meta-llama/llama-agentic-system;
      Purple Llama GitHub repo for trust tools.
    quote: We've provided quantized checkpoints for deployment flexibility, but all reported evaluations
      and testing were conducted on bf16 models. [...] We provide code for on-the-fly int4 quantization
      which minimizes performance degradation as well. [...] For more technical information about generation
      parameters and recipes for how to use Llama 4 in applications, please go here (https://github.com/meta-llama/llama-cookbook).
      [...] We provide the community with system level protections (https://llama.meta.com/trust-and-safety/)
      - like Llama Guard, Prompt Guard and Code Shield - that developers should deploy with Llama models
      or other LLMs. [...] Our Trust tools are open sourced for the community to use and widely distributed
      across ecosystem partners including cloud service providers.
    source_url: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct
    source_type: card
