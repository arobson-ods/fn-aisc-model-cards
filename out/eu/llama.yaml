- id: how_data_was_obtained_and_selected
  section: Information on the data used for training, testing, and validation
  item: How data was obtained and selected
  audience:
    AIO: true
    NCA: true
    DP: false
  precision: null
  status: answered
  answers:
  - fact_id: data_acquisition
    status: prose
    value: Pretraining data is a mix of publicly available data, licensed data, and information from Meta's
      products and services (including publicly shared Instagram and Facebook posts and people's interactions
      with Meta AI). For safety fine-tuning, data combines human-generated data from vendors with synthetic
      data, with LLM-based classifiers used to select high-quality prompts and responses.
    quote: 'Overview: Llama 4 Scout was pretrained on ~40 trillion tokens and Llama 4 Maverick was pretrained
