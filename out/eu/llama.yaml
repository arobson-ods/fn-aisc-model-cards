- id: intended_uses
  section: Use
  item: Intended uses
  audience:
    AIO: true
    NCA: true
    DP: true
  precision: null
  status: answered
  answers:
  - fact_id: intended_uses
    status: prose
    value: Commercial and research use in multiple languages. Instruction tuned models are intended for
      assistant-like chat and visual reasoning tasks; pretrained models can be adapted for natural language
      generation. Vision uses include visual recognition, image reasoning, captioning, and answering general
      questions about an image. Also supports using model outputs to improve other models, including synthetic
      data generation and distillation.
    quote: Llama 4 is intended for commercial and research use in multiple languages. Instruction tuned
      models are intended for assistant-like chat and visual reasoning tasks, whereas pretrained models
      can be adapted for natural language generation. For vision, Llama 4 models are also optimized for
      visual recognition, image reasoning, captioning, and answering general questions about an image.
      The Llama 4 model collection also supports the ability to leverage the outputs of its models to
      improve other models including synthetic data generation and distillation.
    source_url: https://huggingface.co/meta-llama/Llama-4-Scout-17B-16E-Instruct
    source_type: card
