- id: total_model_size
  section: Model properties
  item: Total model size
  description: The total number of parameters of the model, recorded with at least two significant figures,
    e.g. 7.3*10^10 parameters.
  recommended_length: null
  audience:
    AIO: true
    NCA: false
    DP: false
  precision: exact
  public: false
