- id: model_name
  section: General information
  item: Model name
  description: The unique identifier for the model (e.g. Llama 3.1-405B), including the identifier for
    the collection of models where applicable, and a list of the names of the publicly available versions
    of the concerned model covered by the Model Documentation.
  recommended_length: null
  audience:
    AIO: true
    NCA: true
    DP: true
  public: false
- id: model_authenticity
  section: General information
  item: Model authenticity
  description: Evidence that establishes the provenance and authenticity of the model (e.g. a secure hash
    if binaries are distributed, or the URL endpoint in the case of a service), where available.
  recommended_length: null
  audience:
    AIO: true
    NCA: true
    DP: false
  public: false
- id: release_date
  section: General information
  item: Release date
  description: Date when the model was first released through any distribution channel.
  recommended_length: null
  audience:
    AIO: true
    NCA: true
    DP: true
  public: false
- id: union_market_release_date
  section: General information
  item: Union market release date
  description: Date when the model was placed on the Union market.
  recommended_length: null
  audience:
    AIO: true
    NCA: true
    DP: true
  public: false
- id: model_dependencies
  section: General information
  item: Model dependencies
  description: If the model is the result of a modification or fine-tuning of one or more general-purpose
    AI models previously placed on the market, list the model name(s) (and relevant version(s) if more
    than one version has been placed on the market) of those model(s). Otherwise write ‘N/A’.
  recommended_length: null
  audience:
    AIO: true
    NCA: true
    DP: true
  public: false
- id: model_architecture
  section: Model properties
  item: Model architecture
  description: A general description of the model architecture, e.g. a transformer architecture. [Recommended
    20 words]
  recommended_length: 20 words
  audience:
    AIO: true
    NCA: true
    DP: true
  public: false
- id: design_specifications_of_the_model
  section: Model properties
  item: Design specifications of the model
  description: 'A general description of the key design specifications of the model, including rationale
