  hf: {structured: [], prose_hint: [Compute, FLOPs, Training]}
  spdx: {kind: escape_hatch, path: 'ai_AIPackage.ai_informationAboutTraining'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=trainingCompute]'}
  eu: {items: [amount_of_computation_used_for_training, amount_of_computation_used_for_training_2]}

- id: compute_methodology
  group: training_process
  description: Methodology used to measure or estimate training computation.
  hf: {structured: [], prose_hint: [Compute, FLOPs]}
  spdx: {kind: escape_hatch, path: 'ai_AIPackage.comment'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=trainingComputeMethodology]'}
  eu: {items: [amount_of_computation_used_for_training_2_methodology]}

# ---------------------------------------------------------------- energy
- id: training_energy
  group: energy
  description: Energy used for training (e.g. MWh or kWh).
  hf: {structured: [], prose_hint: [Environmental Impact, Energy, Carbon, Greenhouse Gas]}
  spdx: {kind: field, path: 'ai_energyConsumption.ai_trainingEnergyConsumption[] (energyQuantity, energyUnit)'}
  cdx: {kind: field, path: 'modelCard.considerations.environmentalConsiderations.energyConsumptions[activity=training].activityEnergyCost'}
