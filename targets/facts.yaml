# Canonical fact list: the comparison frame for model cards vs SPDX 3.0.1 / CycloneDX 1.7.2 / EU form.
#
# Per target, `kind` is:
#   field        the standard defines a property/relationship whose meaning covers this fact
#   escape_hatch the fact can only be put in a generic bag (SPDX comment/description/extension,
#                CycloneDX properties, a DictionaryEntry/externalRef whose definition doesn't cover it)
#                -> counted as a SCHEMA gap, flagged escape_hatch
#   none         no place at all -> SCHEMA gap
# `fit: coarse` marks a real field that is lossy for this fact (enum too narrow, one string for
# many facts, wrong unit). It still counts as a field; reported separately.
# `eu.items` are ids in targets/eu_form.yaml; `eu: null` means the form does not ask for the fact.
#
# hf.structured sources, tried in order (pass 1):
#   card:<path>    cardData (card YAML front matter)          -> source_type card_metadata
#   api:<path>     HF API field computed by the Hub           -> source_type hub_api
#   config:<path>  config.json in the repo                    -> source_type repo_config
#   tags:<prefix>  HF tags starting with prefix (value after it) -> source_type card_metadata
#   derived:<name> deterministic lookup implemented in pipeline/extract.py (documented there)
# Alternatives within one source are separated by '|'. hf.prose: false skips the LLM pass.
#
# Status: DRAFT (AI-drafted 2026-09-30). Every row needs human review; set reviewed: true.

version: 1
facts:

# ---------------------------------------------------------------- identity & provider
- id: provider_name
  group: identity
  description: Legal or organisational name of the model provider (developer) that releases the model.
  hf: {structured: [], prose_hint: [Model Details, Model Information, Model developer]}
  spdx: {kind: field, path: 'suppliedBy -> Organization.name'}
  cdx: {kind: field, path: 'components[].supplier.name'}
  eu: {items: [legal_name_for_the_model_provider]}
  note: "HF author handle (api.author) is an account name, not a legal name, so it is not used."

- id: model_name
  group: identity
  description: Unique model identifier / name.
  hf: {structured: ['api:id'], prose: false}
  spdx: {kind: field, path: 'ai_AIPackage.name'}
  cdx: {kind: field, path: 'components[].name'}
  eu: {items: [model_name]}

- id: model_version
  group: identity
  description: Version identifier of this model release (named version or repository revision).
  hf: {structured: ['api:sha'], prose_hint: [Model Details]}
  spdx: {kind: field, path: 'ai_AIPackage.software_packageVersion'}
  cdx: {kind: field, path: 'components[].version'}
  eu: {items: [model_name]}
  note: "api.sha is the Hub git commit; platform-supplied, not lab-declared."

- id: model_authenticity
  group: identity
  description: Evidence of provenance/authenticity, e.g. a secure hash of the distributed weights.
  hf: {structured: ['api:sha'], prose: false}
  spdx: {kind: field, path: 'ai_AIPackage.verifiedUsing[] -> Hash'}
  cdx: {kind: field, path: 'components[].hashes[]'}
  eu: {items: [model_authenticity]}
  note: "Git commit SHA-1 of the repo (Hub-supplied). Per-file sha256 exists in LFS metadata but is not a card field."

- id: release_date
  group: identity
  description: Date the model was first released.
  hf: {structured: [], prose_hint: [Model Details, Model Release Date, Release]}
  spdx: {kind: field, path: 'ai_AIPackage.releaseTime'}
  cdx: {kind: escape_hatch, path: 'components[].properties[name=releaseDate]'}
  eu: {items: [release_date]}
  note: "api.createdAt is repo creation time, not a declared release date; used only to satisfy SPDX's required releaseTime, flagged in the document."

- id: eu_release_date
  group: identity
  description: Date the model was placed on the EU market.
  hf: {structured: [], prose_hint: []}
  spdx: {kind: none, path: null}
  cdx: {kind: none, path: null}
  eu: {items: [union_market_release_date]}

# ---------------------------------------------------------------- licensing
- id: license
  group: licensing
  description: Licence(s) under which the model weights are made available (identifier, name or link).
  hf: {structured: ['card:license', 'card:license_name', 'card:license_link'], prose_hint: [License]}
  spdx: {kind: field, path: 'Relationship(hasDeclaredLicense) -> simplelicensing_LicenseExpression'}
  cdx: {kind: field, path: 'components[].licenses[]'}
  eu: {items: [license, license_2]}
  note: "HF 'other' means a custom licence; license_name/license_link then carry it."

- id: acceptable_use_policy
  group: licensing
  description: Acceptable use policy or use restrictions that apply to the model (link or text).
  hf: {structured: [], prose_hint: [Acceptable Use, License, Use Policy]}
  spdx: {kind: escape_hatch, path: 'externalRef[externalRefType=other]'}
  cdx: {kind: escape_hatch, path: 'components[].externalReferences[type=other]'}
  eu: {items: [acceptable_use_policy]}

- id: access_conditions
  group: licensing
  description: Conditions for accessing the weights (e.g. gated access requiring agreement or approval).
  hf: {structured: ['api:gated', 'card:extra_gated_prompt'], prose_hint: []}
  spdx: {kind: escape_hatch, path: 'comment'}
  cdx: {kind: escape_hatch, path: 'components[].properties[name=accessConditions]'}
  eu: null

- id: additional_assets
  group: licensing
  description: Other assets released with the model (training data, training code, inference or evaluation code, checkpoints) and how to access them.
  hf: {structured: [], prose_hint: [Model Sources, Resources, Links]}
  spdx: {kind: escape_hatch, path: 'Relationship(other) -> software_Package'}
  cdx: {kind: field, path: 'components[].externalReferences[type=vcs|distribution|build-meta]'}
  eu: {items: [license_3]}

# ---------------------------------------------------------------- architecture & size
- id: architecture_family
  group: architecture
  description: Model architecture family or type (e.g. transformer decoder, mixture-of-experts).
  hf: {structured: [], prose_hint: [Model Architecture, Model Details, Model Summary]}
  spdx: {kind: field, path: 'ai_AIPackage.ai_typeOfModel[]'}
  cdx: {kind: field, path: 'modelCard.modelParameters.architectureFamily'}
  eu: {items: [model_architecture]}
  note: "Not taken from config.architectures: that is a code class name (e.g. Olmo3ForCausalLM), not an architecture family (auto-check 2026-09-30)."

- id: architecture_details
  group: architecture
  description: Description of key design specifications (layers, attention type, experts, active parameters) and the rationale for them.
  hf: {structured: [], prose_hint: [Model Architecture, Model Summary, Architecture]}
  spdx: {kind: escape_hatch, path: 'description'}
  cdx: {kind: field, path: 'modelCard.modelParameters.modelArchitecture'}
  eu: {items: [design_specifications_of_the_model]}

- id: param_count
  group: architecture
  description: Total number of parameters.
  hf: {structured: ['api:safetensors.total', 'api:gguf.total'], prose_hint: [Model Details, Model Summary, Parameters]}
  spdx: {kind: escape_hatch, path: 'ai_hyperparameter[key=parameterCount]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=parameterCount]'}
  eu: {items: [total_model_size, total_model_size_2]}
  note: "A parameter count is not a hyperparameter per SPDX's definition; OWASP also puts it in properties."

- id: input_modalities
  group: architecture
  description: Input modalities accepted (text, images, audio, video).
  hf: {structured: ['derived:pipeline_input_modalities'], prose_hint: [Input, Modalities, Model Information]}
  spdx: {kind: escape_hatch, path: 'ai_hyperparameter[key=inputModality]'}
  cdx: {kind: field, path: 'modelCard.modelParameters.inputs[].format'}
  eu: {items: [input_modalities]}

- id: max_input_size
  group: architecture
  description: Maximum input size (context length in tokens, or maximum image/audio size).
  hf: {structured: ['config:max_position_embeddings|text_config.max_position_embeddings'], prose_hint: [Context Length, Model Details]}
  spdx: {kind: field, path: 'ai_hyperparameter[key=contextLength]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=contextLength]'}
  eu: {items: [input_modalities_maximum_size]}
  note: "config max_position_embeddings is the positional limit, which some cards say differs from the supported context."

- id: output_modalities
  group: architecture
  description: Output modalities produced (text, images, audio, video).
  hf: {structured: ['derived:pipeline_output_modalities'], prose_hint: [Output, Modalities]}
  spdx: {kind: escape_hatch, path: 'ai_hyperparameter[key=outputModality]'}
  cdx: {kind: field, path: 'modelCard.modelParameters.outputs[].format'}
  eu: {items: [output_modalities_modalities]}

- id: max_output_size
  group: architecture
  description: Maximum output size (e.g. maximum generated tokens).
  hf: {structured: [], prose_hint: [Output, Generation, Context Length]}
  spdx: {kind: escape_hatch, path: 'ai_hyperparameter[key=maxOutputTokens]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=maxOutputSize]'}
  eu: {items: [output_modalities_maximum_size]}

- id: task
  group: architecture
  description: Primary task the model performs (e.g. text generation, image-text-to-text).
  hf: {structured: ['card:pipeline_tag', 'api:pipeline_tag'], prose: false}
  spdx: {kind: escape_hatch, path: 'ai_domain[]'}
  cdx: {kind: field, path: 'modelCard.modelParameters.task'}
  eu: null
  note: "SPDX software_primaryPurpose is fixed to 'model'; ai_domain is the application domain, not the task."

- id: weights_precision
  group: architecture
  description: Numeric precision or quantisation of the released weights (e.g. bf16, FP8, GGUF Q4_K_M).
  hf: {structured: ['config:quantization_config.quant_method|torch_dtype|dtype', 'tags:gguf'], prose_hint: [Quantization, Precision]}
  spdx: {kind: escape_hatch, path: 'ai_hyperparameter[key=precision]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=precision]'}
  eu: null

# ---------------------------------------------------------------- training data
- id: training_datasets
  group: training_data
  description: Named training datasets (names or identifiers).
  hf: {structured: ['card:datasets'], prose_hint: [Training Data, Datasets]}
  spdx: {kind: field, path: 'Relationship(trainedOn) -> dataset_DatasetPackage'}
  cdx: {kind: field, path: 'modelCard.modelParameters.datasets[] -> components[type=data]'}
  eu: null
  note: "The Model Documentation Form does not ask for a dataset list; that belongs to the separate public training-data summary (Art. 53(1)(d))."

- id: data_modality
  group: training_data
  description: Modalities of the training data (text, images, audio, video, other).
  hf: {structured: [], prose_hint: [Training Data]}
  spdx: {kind: field, path: 'dataset_DatasetPackage.dataset_datasetType[]'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].classification'}
  eu: {items: [data_type_modality_select_all_that_apply]}

- id: data_provenance
  group: training_data
  description: Provenance categories of training data (web crawl, licensed/third-party private, user data, public datasets, synthetic, other).
  hf: {structured: [], prose_hint: [Training Data, Data Sources]}
  spdx: {kind: field, fit: coarse, path: 'dataset_DatasetPackage.dataset_dataCollectionProcess'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].description'}
  eu: {items: [data_provenance_select_all_that_apply]}
  note: "SPDX has a free-text collection-process string, no provenance categories."

- id: data_acquisition
  group: training_data
  description: How training data was obtained and selected, including annotation and synthetic-data generation methods and how rights were obtained.
  hf: {structured: [], prose_hint: [Training Data, Data Collection]}
  spdx: {kind: field, path: 'dataset_DatasetPackage.dataset_dataCollectionProcess'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].description'}
  eu: {items: [how_data_was_obtained_and_selected]}

- id: training_data_size
  group: training_data
  description: Size of the training data with its unit (e.g. number of tokens).
  hf: {structured: [], prose_hint: [Training Data, Pretraining, Tokens]}
  spdx: {kind: escape_hatch, path: 'dataset_DatasetPackage.dataset_datasetSize'}
  cdx: {kind: escape_hatch, path: 'components[type=data].properties[name=size]'}
  eu: {items: [number_of_data_points, number_of_data_points_2]}
  note: "SPDX datasetSize is in bytes; token counts do not fit without conversion."

- id: data_scope
  group: training_data
  description: Scope and main characteristics of the training data (domains, languages, geography, modality coverage).
  hf: {structured: [], prose_hint: [Training Data]}
  spdx: {kind: escape_hatch, path: 'dataset_DatasetPackage.description'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].description'}
  eu: {items: [scope_and_main_characteristics]}

- id: knowledge_cutoff
  group: training_data
  description: Data freshness / knowledge cutoff date of the training data.
  hf: {structured: [], prose_hint: [Training Data, Data Freshness, Cutoff]}
  spdx: {kind: escape_hatch, path: 'dataset_DatasetPackage.comment'}
  cdx: {kind: escape_hatch, path: 'components[type=data].properties[name=knowledgeCutoff]'}
  eu: null

- id: data_curation
  group: training_data
  description: Data processing and curation (cleaning, filtering, deduplication, normalisation, augmentation).
  hf: {structured: [], prose_hint: [Training Data, Data Processing, Preprocessing]}
  spdx: {kind: field, path: 'dataset_DatasetPackage.dataset_dataPreprocessing[] / ai_modelDataPreprocessing[]'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].description'}
  eu: {items: [data_curation_methodologies]}

- id: unsuitable_data_measures
  group: training_data
  description: Measures to detect or remove unsuitable data (illegal content, CSAM, NCII, unlawful personal data, harmful content).
  hf: {structured: [], prose_hint: [Training Data, Data Filtering, Safety]}
  spdx: {kind: escape_hatch, path: 'dataset_DatasetPackage.comment'}
  cdx: {kind: escape_hatch, path: 'components[type=data].data[].description'}
  eu: {items: [measures_to_detect_unsuitability_of_data_sources]}

- id: personal_data
  group: training_data
  description: Whether training data includes personal or sensitive personal information, and how it was handled (e.g. anonymisation).
  hf: {structured: [], prose_hint: [Training Data, Privacy]}
  spdx: {kind: field, path: 'dataset_hasSensitivePersonalInformation / dataset_anonymizationMethodUsed / ai_useSensitivePersonalInformation'}
  cdx: {kind: field, path: 'components[type=data].data[].sensitiveData[]'}
  eu: {items: [measures_to_detect_unsuitability_of_data_sources]}

- id: data_bias_measures
  group: training_data
  description: Measures to detect or address identifiable biases in the training data, or known biases.
  hf: {structured: [], prose_hint: [Bias, Risks and Limitations, Training Data]}
  spdx: {kind: field, fit: coarse, path: 'dataset_DatasetPackage.dataset_knownBias[]'}
  cdx: {kind: field, fit: coarse, path: 'modelCard.considerations.fairnessAssessments[]'}
  eu: {items: [measures_to_detect_identifiable_biases]}
  note: "Both targets hold known biases or fairness results, not the detection methods the form asks for."

# ---------------------------------------------------------------- training process & compute
- id: training_method
  group: training_process
  description: Main stages and methods of training (pretraining, SFT, preference optimisation/DPO, RL, distillation, merging).
  hf: {structured: [], prose_hint: [Training, Training Procedure, Post-training]}
  spdx: {kind: field, path: 'ai_AIPackage.ai_informationAboutTraining'}
  cdx: {kind: field, fit: coarse, path: 'modelCard.modelParameters.approach.type'}
  eu: {items: [design_specifications_of_the_training_process]}
  note: "CycloneDX approach.type is a 5-value enum (supervised, self-supervised, ...)."

- id: design_rationale
  group: training_process
  description: How and why key design choices in training were made.
  hf: {structured: [], prose_hint: [Training, Design]}
  spdx: {kind: escape_hatch, path: 'ai_AIPackage.comment'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=designRationale]'}
  eu: {items: [decision_rationale]}

- id: hyperparameters
  group: training_process
