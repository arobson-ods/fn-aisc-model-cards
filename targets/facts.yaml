  note: "The form asks for hardware-days in the precise training-time item."

- id: training_time
  group: training_process
  description: Duration of training (wall-clock days, GPU/accelerator hours).
  hf: {structured: [], prose_hint: [Training, Hardware, Compute, GPU hours]}
  spdx: {kind: escape_hatch, path: 'ai_AIPackage.ai_informationAboutTraining'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=trainingTime]'}
  eu: {items: [training_time, training_time_2]}

- id: training_compute
  group: training_process
