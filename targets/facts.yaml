  hf: {structured: ['card:co2_eq_emissions'], prose_hint: [Environmental Impact, Carbon, Greenhouse Gas]}
  spdx: {kind: none, path: null}
  cdx: {kind: field, path: 'modelCard.considerations.environmentalConsiderations.energyConsumptions[].co2CostEquivalent'}
  eu: null

- id: inference_compute
  group: energy
  description: Benchmarked computation (FLOPs) or energy used for inference, and how it was measured.
  hf: {structured: [], prose_hint: [Inference, Efficiency]}
  spdx: {kind: escape_hatch, path: 'ai_energyConsumption.ai_inferenceEnergyConsumption[]'}
  cdx: {kind: escape_hatch, path: 'modelCard.considerations.environmentalConsiderations.energyConsumptions[activity=inference]'}
  eu: {items: [benchmarked_amount_of_computation_used_for_inferen, benchmarked_amount_of_computation_used_for_inferen_methodology]}
  note: "Both targets hold inference energy, not FLOPs; the form asks for FLOPs."

