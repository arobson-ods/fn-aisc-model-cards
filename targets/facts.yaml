- id: autonomy
  group: safety
  description: Whether the model or system acts autonomously, or requires human-in-the-loop oversight.
  hf: {structured: [], prose_hint: [Intended Use, Safety, Agentic]}
  spdx: {kind: field, path: 'ai_AIPackage.ai_autonomyType'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=autonomyType]'}
  eu: null

- id: explainability
  group: safety
  description: Explainability or interpretability mechanisms for the model's outputs.
  hf: {structured: [], prose_hint: [Explainability, Interpretability, Model Examination]}
  spdx: {kind: field, path: 'ai_AIPackage.ai_modelExplainability[]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=explainability]'}
  eu: null

- id: standards_compliance
  group: safety
  description: Standards, frameworks or regulations the model claims to follow (e.g. ISO/IEC 42001, AI Act Code of Practice).
  hf: {structured: [], prose_hint: [Compliance, Responsibility, Safety]}
  spdx: {kind: field, path: 'ai_AIPackage.ai_standardCompliance[]'}
  cdx: {kind: escape_hatch, path: 'modelCard.properties[name=standardCompliance]'}
  eu: null

# ---------------------------------------------------------------- lineage
- id: base_model
  group: lineage
  description: Model(s) this model was derived from (fine-tuned, quantised, merged or adapted from).
  hf: {structured: ['card:base_model'], prose_hint: [Model Details, Base Model, Finetuned from]}
  spdx: {kind: field, path: 'Relationship(descendantOf) -> ai_AIPackage'}
  cdx: {kind: field, path: 'components[].pedigree.ancestors[]'}
  eu: {items: [model_dependencies]}

- id: base_model_relation
  group: lineage
  description: Type of derivation from the base model (fine-tune, quantisation, merge, adapter).
  hf: {structured: ['card:base_model_relation', 'derived:base_model_relation_tags'], prose_hint: [Model Details]}
  spdx: {kind: escape_hatch, path: 'Relationship(descendantOf).comment'}
  cdx: {kind: escape_hatch, path: 'components[].pedigree.notes'}
  eu: {items: [model_dependencies]}
  note: "SPDX descendantOf/hasVariant and CycloneDX ancestors/variants do not say how a model was derived."

# ---------------------------------------------------------------- distribution
- id: distribution_channels
  group: distribution
  description: Methods of distribution (open weights on repositories, API, cloud platforms, apps).
  hf: {structured: [], prose_hint: [Model Sources, Availability, Distribution, Access]}
  spdx: {kind: field, fit: coarse, path: 'software_downloadLocation + externalRef[]'}
  cdx: {kind: field, path: 'components[].externalReferences[type=distribution]'}
  eu: {items: [distribution_channels, distribution_channels_2]}

- id: download_location
  group: distribution
  description: Location from which the weights can be downloaded.
  hf: {structured: ['derived:hub_url'], prose: false}
  spdx: {kind: field, path: 'ai_AIPackage.software_downloadLocation'}
  cdx: {kind: field, path: 'components[].externalReferences[type=distribution].url'}
  eu: {items: [distribution_channels]}
  note: "Hub-supplied: the repo URL itself."
