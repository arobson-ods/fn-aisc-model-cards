  spdx: {kind: escape_hatch, path: 'ai_AIPackage.comment'}
  cdx: {kind: escape_hatch, path: 'modelCard.considerations.environmentalConsiderations.properties[]'}
  eu: {items: [amount_of_energy_used_for_training_methodology]}

- id: carbon_emissions
  group: energy
